<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Taxon & Opinion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 40px; font-family: 'Segoe UI', sans-serif; }
        .form-container { max-width: 900px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .header-section { background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; padding: 30px; }
        .body-section { padding: 30px; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.2px; color: #0d6efd; margin-bottom: 20px; border-bottom: 1px solid #e9ecef; padding-bottom: 8px; font-weight: bold; }
        label { font-weight: 600; color: #495057; margin-bottom: 5px; }
        .opinion-card { background-color: #f0f7ff; border: 1px solid #cfe2ff; border-radius: 8px; padding: 25px; }
        .readonly-field { background-color: #e9ecef; cursor: not-allowed; color: #6c757d; }
        .btn-new { white-space: nowrap; min-width: 150px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-section">
        <h4 class="mb-4">Edit Existing Taxon Record</h4>
        <div class="row g-4">
            <div class="col-md-12">
                <label class="form-label">Select Taxon to Edit <span class="text-danger">*</span></label>
                <select class="form-select form-select-lg" id="taxonSelector">
                    <option selected disabled>Search taxa table...</option>
                    <option value="1">Canis lupus</option>
                    <option value="2">Tyrannosaurus rex</option>
                </select>
            </div>
            
            <div class="col-md-12">
                <label class="form-label">Authority (Original Creator)</label>
                <input type="text" class="form-control readonly-field" id="authorityField" placeholder="Auto-populates from taxon selection..." readonly>
            </div>

            <div class="col-md-12">
                <label class="form-label">Reference for this Edit <span class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search References (e.g., current publication)...">
                    <button class="btn btn-outline-primary btn-new" type="button">+ New Reference</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="body-section">
        <form>
            <div class="section-title">Taxonomic Identity</div>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label">Taxon Name</label>
                    <input type="text" class="form-control" id="taxonName">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Common Name</label>
                    <input type="text" class="form-control" id="commonName">
                </div>
            </div>

            <div class="section-title">Scientific Opinion (Update Classification)</div>
            <div class="opinion-card">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Taxonomy Rank</label>
                        <select class="form-select">
                            <option selected disabled>Select Rank...</option>
                            <option>species</option>
                            <option>genus</option>
                            <option>family</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phylogenetic Status</label>
                        <select class="form-select">
                            <option selected disabled>Select Status...</option>
                            <option>Monophyletic</option>
                            <option>Paraphyletic</option>
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Parent Taxon</label>
                        <input type="text" class="form-control" placeholder="Search taxa table...">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Synonym Of</label>
                        <input type="text" class="form-control" placeholder="Search taxa table...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Synonym Type</label>
                        <select class="form-select">
                            <option selected disabled>Select relationship type...</option>
                            <option>subjective synonym of</option>
                            <option>objective synonym of</option>
                            <option>misspelling of</option>
                            <option>nomen dubium</option>
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Misspelling Of</label>
                        <input type="text" class="form-control" placeholder="Search taxa table...">
                    </div>
                    
                    <div class="col-md-12 mt-3">
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="extantTaxon">
                                <label class="form-check-label" for="extantTaxon">Extant</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="formTaxon">
                                <label class="form-check-label" for="formTaxon">Form Taxon</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="invalidTaxon">
                                <label class="form-check-label text-danger fw-bold" for="invalidTaxon">Mark as Invalid</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-5 d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-outline-secondary px-4">Cancel Edits</button>
                <button type="submit" class="btn btn-primary px-5">Update Record</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
